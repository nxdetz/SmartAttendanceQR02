<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เช็คชื่อเข้าเรียน</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(130deg,#18364b,#26715e);font:16px Tahoma,Arial;padding:20px}
.box{background:#fff;border-radius:18px;padding:32px 24px;width:min(420px,100%);text-align:center}
.icon{font-size:64px;line-height:1}h1{font-size:22px;margin:12px 0 6px}p{margin:6px 0;color:#52646e}
.ok h1{color:#16845d}.info h1{color:#18628b}.err h1{color:#b42318}
.name{font-size:20px;font-weight:bold;color:#20313b}
button{margin-top:16px;background:#18364b;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:16px;font-weight:bold;cursor:pointer}
</style></head><body><div class="box" id="box"><div class="icon" id="icon">⏳</div><h1 id="title">กำลังเช็คชื่อ...</h1><p id="msg"></p><div id="extra"></div></div>
<script>
const box=document.getElementById('box'),icon=document.getElementById('icon'),title=document.getElementById('title'),msg=document.getElementById('msg'),extra=document.getElementById('extra');
function show(cls,i,t,m){box.className='box '+cls;icon.textContent=i;title.textContent=t;msg.textContent=m||''}
function lines(d){extra.innerHTML='';[['ชื่อ',d.name,'name'],['รายวิชา',d.course],['เวลา',d.time]].forEach(a=>{let p=document.createElement('p');if(a[2])p.className=a[2];p.textContent=(a[2]?'':a[0]+': ')+a[1];extra.appendChild(p)})}
async function go(){
 show('','⏳','กำลังเช็คชื่อ...','');extra.innerHTML='';
 let token=location.pathname.split('/').filter(Boolean).pop();
 try{
  let r=await fetch('/api/public/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok)throw Error(d.message||'เกิดข้อผิดพลาด');
  if(d.already)show('info','ℹ️','เช็คชื่อไปแล้ววันนี้','');else show('ok','✅','เช็คชื่อสำเร็จ','');
  lines(d);
 }catch(e){
  show('err','⚠️','เช็คชื่อไม่สำเร็จ',e.message);
  let b=document.createElement('button');b.textContent='ลองอีกครั้ง';b.onclick=go;extra.innerHTML='';extra.appendChild(b);
 }
}
go();
</script></body></html>
